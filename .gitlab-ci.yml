stages:
  - .pre
  - stable_test
  - nightly_test
  - tier3_build
  - tier3_test

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/cargo
  STABLE_RUST_VERSION: "1.80.0"
  WASMTIME_VERSION: "23.0.1"

default:
  image: docker.io/library/rust:${STABLE_RUST_VERSION}-slim-bookworm
  cache:
    key: ${CI_JOB_STAGE}-${TARGET}
    paths:
      - target/${TARGET}

.default_rule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*.yaml
        - .cargo/config.toml
        - Cargo.toml
        - crate/**/*.rs
        - src/**/*.rs
    - when: always

include:
  - local: .gitlab/ci/target.yaml
  - local: .gitlab/ci/stage.yaml
