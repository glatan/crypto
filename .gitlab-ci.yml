stages:
  - .pre
  - stable_test
  - nightly_test

variables:
  UBUNTU_IMAGE: docker.io/ubuntu:24.04
  CARGO_HOME: ${CI_PROJECT_DIR}/cargo
  STABLE_RUST_VERSION: "1.78.0"
  WASMTIME_VERSION: "20.0.2"

.default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*.yaml
        - .cargo/config.toml
        - Cargo.toml
        - crate/**/*.rs
        - src/**/*.rs
    - when: always

include:
  - local: .gitlab/ci/target.yaml
  - local: .gitlab/ci/stage/pre.yaml
  - local: .gitlab/ci/stage/stable_test.yaml
  - local: .gitlab/ci/stage/nightly_test.yaml
    rules:
      - if: $RUN_NIGHTLY_TESTS == "true"
