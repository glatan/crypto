stages:
  - .pre
  - stable_test
  - nightly_test
  - tier3_build
  - tier3_test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/cargo"
  STABLE_RUST_VERSION: '1.84.0'
  WASMTIME_VERSION: '28.0.1'
  MSYS2_VERSION: '2024-12-08'

default:
  cache:
    key: ${CI_JOB_STAGE}-${TARGET}
    paths:
      - target/${TARGET}

include:
  - local: .gitlab/ci/target.yaml
  - local: .gitlab/ci/rule.yaml
  - local: .gitlab/ci/stage.yaml
