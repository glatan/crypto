.disable_merge_request_event: &disable_merge_request_event
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never

.file_change_rule: &file_change_rule
  - changes:
      - .gitlab-ci.yml
      - .gitlab/ci/**/*.yaml
      - .cargo/config.toml
      - Cargo.toml
      - crate/**/*.rs
      - src/**/*.rs

workflow:
  rules:
    - *disable_merge_request_event
    - *file_change_rule

.tier1_linux_test_rule:
  rules:
    - if: $DISABLE_TIER1_LINUX_TEST == "true"
      when: never
    - *disable_merge_request_event
    - *file_change_rule

.tier2_with_host_tool_linux_test_rule:
  rules:
    - *disable_merge_request_event
    - *file_change_rule
    - if: $ENABLE_TIER2_WITH_HOST_TOOLS_LINUX_TEST == "true"

.tier2_without_host_tool_linux_test_rule:
  rules:
    - *disable_merge_request_event
    - *file_change_rule
    - if: $ENABLE_TIER2_WITHOUT_HOST_TOOLS_LINUX_TEST == "true"

.wasm32_test_rule:
  rules:
    - if: $DISABLE_WASM32_TEST == "true"
      when: never
    - *disable_merge_request_event
    - *file_change_rule

.windows-msvc_rule:
  rules:
    - *disable_merge_request_event
    - if: $ENABLE_WINDOWS_MSVC_TEST == "true"

.windows-gnu_rule:
  rules:
    - *disable_merge_request_event
    - if: $ENABLE_WINDOWS_GNU_TEST == "true"

.windows-gnullvm_rule:
  rules:
    - *disable_merge_request_event
    - if: $ENABLE_WINDOWS_GNULLVM_TEST == "true"
