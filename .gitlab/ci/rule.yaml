.disable_merge_request_event: &disable_merge_request_event
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never

.file_change_rule: &file_change_rule
  - changes:
      - .gitlab-ci.yml
      - .gitlab/ci/**/*.yaml
      - .cargo/config.toml
      - Cargo.toml
      - crate/**/*.rs
      - src/**/*.rs

workflow:
  rules:
    - *disable_merge_request_event
    - *file_change_rule

.tier1_linux_test_rule:
  rules:
    # - if: $[[ inputs.ENABLE_TIER1_LINUX_TEST ]]
    #   when: never
    - *disable_merge_request_event
    - *file_change_rule

