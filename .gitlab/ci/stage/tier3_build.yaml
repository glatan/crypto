tier3_linux_build:
  stage: tier3_build
  image: ${NIGHTLY_LINUX_BASE_IMAGE}
  allow_failure: true
  before_script:
    - set -ex
    - rustup component add rust-src
    - >
      if [[ ${#PACKAGES[@]} -ne 0 ]]; then
        apt-get update -y
        apt-get install -y ${PACKAGES};
      fi
  script:
    - cargo build --workspace -Z build-std -vv --target ${TARGET}
  extends:
    - .tier3_linux_matrix_template

pc-cygwin_build:
  extends:
    - .pc-cygwin_rule
  stage: tier3_build
  allow_failure: true
  tags:
    - saas-windows-medium-amd64
  before_script:
    - .gitlab\script\setup_msys2.ps1 -Env msys
    - C:\msys64\usr\bin\bash -lc "pacman --noconfirm -Sy rust"
  script:
    - C:\msys64\usr\bin\bash -lc "cargo build --workspace"
