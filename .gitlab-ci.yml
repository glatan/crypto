stages:
  - .pre
  - stable_test
  - nightly_test
  - tier3_build
  - tier3_test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/cargo"
  STABLE_RUST_VERSION: "1.91.1"
  WASMTIME_VERSION: "39.0.0"
  MSYS2_VERSION: "2025-08-30"
  STABLE_LINUX_BASE_IMAGE: "docker.io/library/rust:${STABLE_RUST_VERSION}-slim-bookworm"
  NIGHTLY_LINUX_BASE_IMAGE: "docker.io/rustlang/rust:nightly-bookworm-slim"

default:
  cache:
    key: ${CI_JOB_STAGE}-${TARGET}
    paths:
      - target/${TARGET}

include:
  - local: .gitlab/ci/target.yaml
  - local: .gitlab/ci/rule.yaml
  - local: .gitlab/ci/stage.yaml
