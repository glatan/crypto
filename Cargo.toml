[package]
name = "crypto"
version = "0.0.1"
readme = "README.md"
edition = "2024"

[workspace.package]
edition = "2024"
rust-version = "1.93.0"
license = "GPL-3.0-only"
homepage = "https://gitlab.com/glatan/crypto/"
repository = "https://gitlab.com/glatan/crypto/"

[workspace.lints.clippy]
missing_const_for_fn = "deny"

[features]
default = [
    "blake2",
    "sha2",
    "sha3",
    "cryptographic_hash_function",
]

all=[
    "blake",
    "blake2",
    "edonr",
    "keccak",
    "md2",
    "md4",
    "md5",
    "ripemd",
    "sha0",
    "sha1",
    "sha2",
    "sha3",
    "cryptographic_hash_function",
    "hmac",
]

[dependencies]
blake = { path = "crate/cryptographic_hash_function/blake", optional = true }
blake2 = { path = "crate/cryptographic_hash_function/blake2", optional = true }
edonr = { path = "crate/cryptographic_hash_function/edonr", optional = true }
keccak = { path = "crate/cryptographic_hash_function/keccak", optional = true }
md2 = { path = "crate/cryptographic_hash_function/md2", optional = true }
md4 = { path = "crate/cryptographic_hash_function/md4", optional = true }
md5 = { path = "crate/cryptographic_hash_function/md5", optional = true }
ripemd = { path = "crate/cryptographic_hash_function/ripemd", optional = true }
sha0 = { path = "crate/cryptographic_hash_function/sha0", optional = true }
sha1 = { path = "crate/cryptographic_hash_function/sha1", optional = true }
sha2 = { path = "crate/cryptographic_hash_function/sha2", optional = true }
sha3 = { path = "crate/cryptographic_hash_function/sha3", optional = true }
cryptographic_hash_function = { path = "crate/cryptographic_hash_function/cryptographic_hash_function", optional = true }
hmac = { path = "crate/mac/hmac", optional = true }

[workspace]
members = [
    # Cryptographic Hash Function
    "crate/cryptographic_hash_function/blake",
    "crate/cryptographic_hash_function/blake2",
    "crate/cryptographic_hash_function/edonr",
    "crate/cryptographic_hash_function/keccak",
    "crate/cryptographic_hash_function/md2",
    "crate/cryptographic_hash_function/md4",
    "crate/cryptographic_hash_function/md5",
    "crate/cryptographic_hash_function/ripemd",
    "crate/cryptographic_hash_function/sha0",
    "crate/cryptographic_hash_function/sha1",
    "crate/cryptographic_hash_function/sha2",
    "crate/cryptographic_hash_function/sha3",
    "crate/cryptographic_hash_function/dev-util",
    "crate/cryptographic_hash_function/cryptographic_hash_function",
    "crate/cryptographic_hash_function/merkle_damgard",
    "crate/mac/hmac",
    "crate/byte"
]
exclude = [
    "examples",
]
