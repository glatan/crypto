stages:
  - .pre
  - stable_test
  - nightly_test
  - tier3_build
  - tier3_test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/cargo"
  STABLE_RUST_VERSION: "1.85.0"
  WASMTIME_VERSION: "30.0.0"
  MSYS2_VERSION: "2025-02-21"

default:
  cache:
    key: ${CI_JOB_STAGE}-${TARGET}
    paths:
      - target/${TARGET}

include:
  - local: .gitlab/ci/target.yaml
  - local: .gitlab/ci/rule.yaml
  - local: .gitlab/ci/stage.yaml
