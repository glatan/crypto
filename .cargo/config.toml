# Tier 1

[target.aarch64-unknown-linux-gnu]
linker = 'aarch64-linux-gnu-gcc'
runner = 'qemu-aarch64 -L /usr/aarch64-linux-gnu/'

[target.i686-pc-windows-gnu]
linker = 'i686-w64-mingw32-gcc'

[target.i686-unknown-linux-gnu]
linker = 'i686-linux-gnu-gcc'
runner = 'qemu-i386 -L /usr/i686-linux-gnu/'

[target.x86_64-pc-windows-gnu]
linker = 'x86_64-w64-mingw32-gcc'

# Tier 2 with Host Tools

[target.aarch64-unknown-linux-musl]
linker = 'aarch64-linux-gnu-gcc'
runner = 'qemu-aarch64 -L /usr/aarch64-linux-gnu/'

[target.arm-unknown-linux-gnueabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.arm-unknown-linux-gnueabihf]
linker = 'arm-linux-gnueabihf-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabihf/'

[target.armv7-unknown-linux-gnueabihf]
linker = 'arm-linux-gnueabihf-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabihf/'

[target.powerpc-unknown-linux-gnu]
linker = 'powerpc-linux-gnu-gcc'
runner = 'qemu-ppc -L /usr/powerpc-linux-gnu/'

[target.powerpc64-unknown-linux-gnu]
linker = 'powerpc64-linux-gnu-gcc'
runner = 'qemu-ppc64 -L /usr/powerpc64-linux-gnu/'

[target.powerpc64le-unknown-linux-gnu]
linker = 'powerpc64le-linux-gnu-gcc'
runner = 'qemu-ppc64le -L /usr/powerpc64le-linux-gnu/'

[target.powerpc64le-unknown-linux-musl]
linker = 'powerpc64le-linux-gnu-gcc'
runner = 'qemu-ppc64le -L /usr/powerpc64le-linux-gnu/'

[target.riscv64gc-unknown-linux-gnu]
linker = 'riscv64-linux-gnu-gcc'
runner = 'qemu-riscv64 -L /usr/riscv64-linux-gnu/'

[target.riscv64gc-unknown-linux-musl]
linker = 'riscv64-linux-gnu-gcc'
runner = 'qemu-riscv64 -L /usr/riscv64-linux-gnu/'
rustflags = ["-C", "target-feature=+crt-static"]

[target.s390x-unknown-linux-gnu]
linker = 's390x-linux-gnu-gcc'
runner = 'qemu-s390x -L /usr/s390x-linux-gnu/'

# Tier 2 without Host Tools

[target.aarch64-pc-windows-gnullvm]
linker = 'lld'

[target.arm-unknown-linux-musleabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.arm-unknown-linux-musleabihf]
linker = 'arm-linux-gnueabihf-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabihf/'

[target.armv5te-unknown-linux-gnueabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.armv5te-unknown-linux-musleabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.armv7-unknown-linux-gnueabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.armv7-unknown-linux-musleabi]
linker = 'arm-linux-gnueabi-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabi/'

[target.armv7-unknown-linux-musleabihf]
linker = 'arm-linux-gnueabihf-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabihf/'

[target.i586-unknown-linux-gnu]
linker = 'i686-linux-gnu-gcc'
runner = 'qemu-i386 -L /usr/i686-linux-gnu/'

[target.i586-unknown-linux-musl]
linker = 'i686-linux-gnu-gcc'
runner = 'qemu-i386 -L /usr/i686-linux-gnu/'

[target.i686-pc-windows-gnullvm]
linker = 'lld'

[target.i686-unknown-linux-musl]
linker = 'i686-linux-gnu-gcc'
runner = 'qemu-i386 -L /usr/i686-linux-gnu/'

[target.sparc64-unknown-linux-gnu]
linker = 'sparc64-linux-gnu-gcc'
runner = 'qemu-sparc64 -L /usr/sparc64-linux-gnu/'

[target.thumbv7neon-unknown-linux-gnueabihf]
linker = 'arm-linux-gnueabihf-gcc'
runner = 'qemu-arm -L /usr/arm-linux-gnueabihf/'

[target.wasm32-wasip1]
runner = 'wasmtime run --dir /::.'

[target.wasm32-wasip2]
runner = 'wasmtime run --dir /::.'

[target.wasm32-wasip1-threads]
runner = 'wasmtime run --dir /::. -S threads=y -W shared-memory=y'

[target.x86_64-pc-windows-gnullvm]
linker = 'lld'

# Tier3

[target.armv4t-unknown-linux-gnueabi]
